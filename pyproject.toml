[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semver-convert"
version = "0.1.0"
description = "Convert versions between SemVer 2.0.0 and 4-part Windows-style numeric versions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "emoore958" }]
dependencies = []

[project.scripts]
semver-convert = "semver_convert.convert:main"

[tool.setuptools.packages.find]
include = ["semver_convert*"]
